<!DOCTYPE html>
<html>
<head>
    <title>Sumeet Singh Thakur Profile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .main-box {
            background-color: #58b5e8;
            padding: 40px;
            border-radius: 15px;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #a6e639;
        }

        .info-box {
            background-color: #f18bab;
            padding: 30px;
            border-radius: 20px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .college-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .achievement-box {
            background-color: #9bdf65;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-top: 10px;
        }

        h2 {
            color: #173c50;
            font-weight: bold;
        }

        h4 {
            color: #263238;
            font-weight: bold;
        }

        p {
            color: #333333;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="main-box">

            <!-- Profile section -->
            <div class="row align-items-center mb-5">

                <div class="col-md-4 text-center">
                    <img src="PHOTO.jpeg" class="profile-img" alt="Sumeet">
                </div>

                <div class="col-md-8 text-center text-md-start mt-3 mt-md-0">
                    <h2>Sumeet Singh Thakur</h2>
                    <p>
                        Hi! I am Sumeet Singh Thakur.
                        I am a student who loves to learn and explore new things.
                    </p>
                </div>

            </div>

            <!-- Education section -->
            <div class="row">

                <div class="col-md-4">
                    <div class="info-box">
                        <img src="school.jpeg"
                             class="college-img" alt="School">

                        <h4>My School</h4>
                        <p>SBR Public School</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="info-box">
                        <img src="clg.jpeg"
                             class="college-img" alt="PU College">

                        <h4>My PU College</h4>
                        <p>SBR PU College</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="info-box">
                        <img src="nie.jpeg"
                             class="college-img" alt="Engineering College">

                        <h4>My Engineering College</h4>
                        <p>NIE North</p>
                    </div>
                </div>

            </div>

            <!-- Achievements section -->
            <div class="row justify-content-center">

                <div class="col-md-6">
                    <div class="achievement-box">
                        <h4>My Achievements</h4>
                        <p>
                            1. Still Alive!🙃
                        </p>
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
